<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YTSnap Clone — Instant YouTube Opener</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0f0f; color: #fff; text-align: center; padding: 40px 20px; }
    .container { max-width: 500px; margin: 0 auto; background: #1f1f1f; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h1 { color: #ff0000; margin-bottom: 5px; }
    input[type="text"] { width: 90%; padding: 12px; margin: 20px 0; border: 1px solid #333; background: #2f2f2f; color: #fff; border-radius: 6px; font-size: 16px; }
    button { background: #ff0000; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #cc0000; }
    .result-box { margin-top: 25px; display: none; background: #2f2f2f; padding: 15px; border-radius: 6px; border: 1px dashed #555; }
    #outputLink { font-weight: bold; color: #3ea6ff; word-break: break-all; display: block; margin-bottom: 10px; }
    .status-msg { font-size: 18px; margin-top: 50px; color: #aaa; }
  </style>
</head>
<body>

<div class="container" id="appInterface">
  <h1>YTSnap Clone</h1>
  <p>Instant YouTube App Opener</p>

  <input type="text" id="ytUrl" placeholder="Paste YouTube Link here...">
  <br>
  <button onclick="generateSnapLink()">SNAP</button>

  <div class="result-box" id="resultBox">
    <p>Your Instant Link — share this anywhere:</p>
    <span id="outputLink"></span>
    <button onclick="copyToClipboard()" style="background:#444;">COPY</button>
  </div>
</div>

<div class="status-msg" id="routingStatus" style="display:none;">
  <h2>Opening YouTube...</h2>
  <p>Launching application instantly. If it doesn't open, <a id="fallbackLink" href="#" style="color:#3ea6ff;">click here</a>.</p>
</div>

<script>
/* Helper: extract 11-char YouTube ID from many URL formats */
function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  // If user just passed the id:
  if (/^[A-Za-z0-9_-]{11}$/.test(url)) return url;
  const regExp = /^.*(?:youtu.be\/|v\/|u\/\w\/|embed\/|watch\?(?:.*&)?v=)([^#&?]{11}).*/;
  const match = url.match(regExp);
  return (match && match[1]) ? match[1] : null;
}

function generateSnapLink() {
  const inputUrl = document.getElementById('ytUrl').value;
  const videoId = extractVideoId(inputUrl);

  if (!videoId) {
    alert("Couldn't find a valid YouTube Video ID. Please check the URL or paste the 11-character ID.");
    return;
  }

  const base = window.location.origin + window.location.pathname;
  const generatedUrl = `${base}?v=${videoId}`;

  document.getElementById('outputLink').innerText = generatedUrl;
  document.getElementById('outputLink').href = generatedUrl;
  document.getElementById('resultBox').style.display = 'block';
}

/* Copy button */
function copyToClipboard() {
  const linkText = document.getElementById('outputLink').innerText;
  navigator.clipboard.writeText(linkText).then(() => {
    alert("Link copied to clipboard!");
  }).catch(() => {
    alert("Copy failed — select and copy manually.");
  });
}

/* Try to open the app, fallback to web after timeout if not opened */
function tryOpenWithFallback(appUrl, webFallback, options = {}) {
  const timeout = options.timeout || 1200;
  let pageHidden = false;

  function onVisibilityChange() {
    if (document.hidden) pageHidden = true;
  }
  document.addEventListener('visibilitychange', onVisibilityChange);

  // Navigate to app URL
  // Use replace on iOS to avoid leaving an extra history entry
  try {
    if (options.useReplace) window.location.replace(appUrl);
    else window.location.href = appUrl;
  } catch (e) {
    // if setting location throws (rare), fallback immediately
    window.location.href = webFallback;
    document.removeEventListener('visibilitychange', onVisibilityChange);
    return;
  }

  setTimeout(() => {
    document.removeEventListener('visibilitychange', onVisibilityChange);
    // If page did not become hidden, assume app didn't open — go to web fallback
    if (!pageHidden) {
      window.location.href = webFallback;
    }
  }, timeout);
}

/* Called on page load to handle ?v=VIDEOID */
function handleIncomingRedirect() {
  const urlParams = new URLSearchParams(window.location.search);
  const videoId = urlParams.get('v');

  if (!videoId) return; // nothing to do

  // Hide generator UI, show routing status
  document.getElementById('appInterface').style.display = 'none';
  document.getElementById('routingStatus').style.display = 'block';

  const webFallback = `https://www.youtube.com/watch?v=${videoId}`;
  document.getElementById('fallbackLink').href = webFallback;

  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua) && !window.MSStream;

  if (isAndroid) {
    // Use Chrome's intent:// format which will open the app if available
    const intentUrl = `intent://www.youtube.com/watch?v=${videoId}#Intent;package=com.google.android.youtube;scheme=https;end`;
    tryOpenWithFallback(intentUrl, webFallback, { timeout: 1200 });
  } else if (isIOS) {
    // Custom scheme for iOS
    const iosUrl = `youtube://watch?v=${videoId}`;
    // useReplace to avoid extra history entry on iOS
    tryOpenWithFallback(iosUrl, webFallback, { timeout: 1500, useReplace: true });
  } else {
    // Desktop: go to web directly
    window.location.href = webFallback;
  }
}

/* Run on load */
window.addEventListener('load', handleIncomingRedirect);
</script>

</body>
</html>
